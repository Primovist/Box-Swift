name: Apple platform builds

on:
  push:
    branches: [main, test/avplayer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-platform-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS and tvOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-xcode26-swiftpm-ffmpeg-bundleid-v1-${{ hashFiles('TVBoxSwift.xcodeproj/project.pbxproj', 'TVBoxSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-swiftpm-ffmpeg-bundleid-v1-

      - name: Resolve KSPlayer packages and repair framework metadata
        if: ${{ github.ref == 'refs/heads/test/avplayer' || github.head_ref == 'test/avplayer' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project TVBoxSwift.xcodeproj \
            -scheme TVBox-iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
          python3 - "$RUNNER_TEMP/DerivedData/SourcePackages/checkouts/FFmpegKit/Sources/libshaderc_combined.xcframework" <<'PY'
          import pathlib
          import plistlib
          import sys

          xcframework_path = pathlib.Path(sys.argv[1])
          original_id = "com.kintan.ksplayer.libshaderc_combined"
          normalized_id = "com.kintan.ksplayer.libshaderc-combined"
          found = {"ios": [], "tvos": []}
          changed = {"ios": 0, "tvos": 0}
          for plist_path in xcframework_path.glob("*/libshaderc_combined.framework/Info.plist"):
              slice_name = plist_path.parents[1].name
              platform = "ios" if slice_name.startswith("ios-") else "tvos" if slice_name.startswith("tvos-") else None
              if platform is None:
                  continue
              found[platform].append(slice_name)
              with plist_path.open("rb") as source:
                  info = plistlib.load(source)
              current_id = info.get("CFBundleIdentifier")
              if current_id == original_id:
                  info["CFBundleIdentifier"] = normalized_id
                  with plist_path.open("wb") as destination:
                      plistlib.dump(info, destination)
                  changed[platform] += 1
              elif current_id != normalized_id:
                  raise SystemExit(f"Unexpected {platform} libshaderc bundle ID in {plist_path}: {current_id!r}")
          if "ios-arm64" not in found["ios"] or "tvos-arm64_arm64e" not in found["tvos"]:
              raise SystemExit(f"Missing iOS/tvOS device libshaderc slices: {found}")
          print(f"Validated libshaderc_combined slices {found}; normalized {changed}")
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS
        id: build-ios
        continue-on-error: true
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          xcodebuild \
            -project TVBoxSwift.xcodeproj \
            -scheme TVBox-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS unsigned IPA
        id: package-ios
        if: ${{ steps.build-ios.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TVBox-iOS.app"
          PAYLOAD_DIRECTORY="$RUNNER_TEMP/ipa/ios/Payload"
          test -d "$APP_PATH"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          IPA_NAME="TVBox-iOS-${APP_VERSION}-${BUILD_VERSION}-unsigned.ipa"
          IPA_PATH="$RUNNER_TEMP/$IPA_NAME"
          mkdir -p "$PAYLOAD_DIRECTORY"
          ditto "$APP_PATH" "$PAYLOAD_DIRECTORY/TVBox-iOS.app"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_DIRECTORY" "$IPA_PATH"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload iOS unsigned IPA
        id: upload-ios
        if: ${{ steps.package-ios.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package-ios.outputs.ipa_name }}
          path: ${{ runner.temp }}/${{ steps.package-ios.outputs.ipa_name }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Retry iOS unsigned IPA upload
        id: upload-ios-retry
        if: ${{ !cancelled() && steps.upload-ios.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package-ios.outputs.ipa_name }}
          path: ${{ runner.temp }}/${{ steps.package-ios.outputs.ipa_name }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Build tvOS
        id: build-tvos
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          xcodebuild \
            -project TVBoxSwift.xcodeproj \
            -scheme TVBox-tvOS \
            -configuration Release \
            -sdk appletvos \
            -destination generic/platform=tvOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package tvOS unsigned IPA
        id: package-tvos
        if: ${{ !cancelled() && steps.build-tvos.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-appletvos/TVBox-tvOS.app"
          PAYLOAD_DIRECTORY="$RUNNER_TEMP/ipa/tvos/Payload"
          test -d "$APP_PATH"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          IPA_NAME="TVBox-tvOS-${APP_VERSION}-${BUILD_VERSION}-unsigned.ipa"
          IPA_PATH="$RUNNER_TEMP/$IPA_NAME"
          mkdir -p "$PAYLOAD_DIRECTORY"
          ditto "$APP_PATH" "$PAYLOAD_DIRECTORY/TVBox-tvOS.app"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_DIRECTORY" "$IPA_PATH"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload tvOS unsigned IPA
        id: upload-tvos
        if: ${{ !cancelled() && steps.package-tvos.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package-tvos.outputs.ipa_name }}
          path: ${{ runner.temp }}/${{ steps.package-tvos.outputs.ipa_name }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Retry tvOS unsigned IPA upload
        id: upload-tvos-retry
        if: ${{ !cancelled() && steps.upload-tvos.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package-tvos.outputs.ipa_name }}
          path: ${{ runner.temp }}/${{ steps.package-tvos.outputs.ipa_name }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Require both unsigned IPAs
        if: ${{ always() }}
        env:
          IOS_BUILD_OUTCOME: ${{ steps.build-ios.outcome }}
          IOS_PACKAGE_OUTCOME: ${{ steps.package-ios.outcome }}
          IOS_UPLOAD_OUTCOME: ${{ steps.upload-ios.outcome }}
          IOS_UPLOAD_RETRY_OUTCOME: ${{ steps.upload-ios-retry.outcome }}
          TVOS_BUILD_OUTCOME: ${{ steps.build-tvos.outcome }}
          TVOS_PACKAGE_OUTCOME: ${{ steps.package-tvos.outcome }}
          TVOS_UPLOAD_OUTCOME: ${{ steps.upload-tvos.outcome }}
          TVOS_UPLOAD_RETRY_OUTCOME: ${{ steps.upload-tvos-retry.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "iOS build:$IOS_BUILD_OUTCOME" \
            "iOS package:$IOS_PACKAGE_OUTCOME" \
            "tvOS build:$TVOS_BUILD_OUTCOME" \
            "tvOS package:$TVOS_PACKAGE_OUTCOME"; do
            step="${result%%:*}"
            outcome="${result#*:}"
            echo "$step: $outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          for platform in iOS tvOS; do
            if [[ "$platform" == "iOS" ]]; then
              first_upload="$IOS_UPLOAD_OUTCOME"
              retry_upload="$IOS_UPLOAD_RETRY_OUTCOME"
            else
              first_upload="$TVOS_UPLOAD_OUTCOME"
              retry_upload="$TVOS_UPLOAD_RETRY_OUTCOME"
            fi
            if [[ "$first_upload" == "success" || "$retry_upload" == "success" ]]; then
              echo "$platform upload: success (attempts: $first_upload, $retry_upload)"
            else
              echo "$platform upload: failure (attempts: $first_upload, $retry_upload)"
              failed=1
            fi
          done
          exit "$failed"

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/avplayer')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download unsigned IPAs
        uses: actions/download-artifact@v8
        with:
          pattern: TVBox-*-unsigned.ipa
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Read build version from both IPAs
        id: release-version
        run: |
          python3 - "$RUNNER_TEMP/release-assets" "$GITHUB_OUTPUT" <<'PY'
          import glob
          import os
          import plistlib
          import sys
          import zipfile

          assets_dir, output_path = sys.argv[1:]
          ipa_paths = sorted(glob.glob(os.path.join(assets_dir, "TVBox-*-unsigned.ipa")))
          if len(ipa_paths) != 2:
              raise SystemExit(f"Expected two platform IPAs, found {len(ipa_paths)}")

          builds = {}
          for ipa_path in ipa_paths:
              platform = os.path.basename(ipa_path).split("-")[1]
              with zipfile.ZipFile(ipa_path) as archive:
                  plist_path = next((name for name in archive.namelist() if name.startswith("Payload/") and name.endswith(".app/Info.plist")), None)
                  if plist_path is None:
                      raise SystemExit(f"Missing app Info.plist in {ipa_path}")
                  info = plistlib.loads(archive.read(plist_path))
              builds[platform] = (str(info["CFBundleShortVersionString"]), str(info["CFBundleVersion"]))

          if set(builds) != {"iOS", "tvOS"}:
              raise SystemExit(f"Expected iOS and tvOS IPAs, found {sorted(builds)}")
          if builds["iOS"] != builds["tvOS"]:
              raise SystemExit(f"Platform versions differ: {builds}")

          version, build_number = builds["iOS"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"build_number={build_number}\n")
              output.write(f"tag=v{version}-build.{build_number}\n")
              output.write(f"test_tag=ksplayer-test-build.{build_number}\n")
          PY

      - name: Publish unsigned IPAs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          TEST_RELEASE_TAG: ${{ steps.release-version.outputs.test_tag }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          BUILD_NUMBER: ${{ steps.release-version.outputs.build_number }}
          IS_KSPLAYER_TEST: ${{ github.ref == 'refs/heads/test/avplayer' }}
        run: |
          set -euo pipefail
          if [[ "$IS_KSPLAYER_TEST" == "true" ]]; then
            TAG="$TEST_RELEASE_TAG"
            TITLE="TV Box KSPlayer test (Build $BUILD_NUMBER)"
            RELEASE_FLAGS=(--prerelease --latest=false)
            NOTES="Experimental KSPlayer 2.3.4 build from $GITHUB_SHA. FFmpeg is the primary playback engine and AVPlayer is the fallback. Hardware decoding is enabled by default. Unsigned IPAs require signing before device installation."
          else
            TAG="$RELEASE_TAG"
            TITLE="TV Box $RELEASE_VERSION (Build $BUILD_NUMBER)"
            RELEASE_FLAGS=()
            NOTES="iOS 和 tvOS 未签名 IPA 构建产物。\n\n源码提交：\`$GITHUB_SHA\`"
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%b\n' "$NOTES" > "$NOTES_FILE"

          set +e
          REMOTE_TAGS=$(git ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" 2>&1)
          TAG_LOOKUP_STATUS=$?
          set -e
          if [[ $TAG_LOOKUP_STATUS -eq 0 ]]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Release tag $TAG already points to $TAG_COMMIT, not $GITHUB_SHA." >&2
              exit 1
            fi
          elif [[ $TAG_LOOKUP_STATUS -ne 2 ]]; then
            echo "Unable to check remote tag $TAG: $REMOTE_TAGS" >&2
            exit "$TAG_LOOKUP_STATUS"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_TARGET=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
            if [[ "$RELEASE_TARGET" != "$GITHUB_SHA" ]]; then
              echo "Release $TAG targets $RELEASE_TARGET, not $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Release $TAG exists for this commit; preserving its existing assets."
          else
            gh release create "$TAG" \
              --draft \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" \
              "${RELEASE_FLAGS[@]}"
          fi

          EXISTING_ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          NEW_ASSETS=()
          while IFS= read -r -d '' IPA_PATH; do
            IPA_NAME=$(basename "$IPA_PATH")
            if ! grep -Fxq "$IPA_NAME" <<< "$EXISTING_ASSETS"; then
              NEW_ASSETS+=("$IPA_PATH")
            fi
          done < <(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -name 'TVBox-*-unsigned.ipa' -print0)

          if [[ ${#NEW_ASSETS[@]} -gt 0 ]]; then
            gh release upload "$TAG" "${NEW_ASSETS[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          gh release edit "$TAG" --draft=false --title "$TITLE" --notes-file "$NOTES_FILE" --repo "$GITHUB_REPOSITORY" "${RELEASE_FLAGS[@]}"
